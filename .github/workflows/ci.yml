# ─────────────────────────────────────────────────────────────
# Paperu — Main CI pipeline
#
# Three-agent model: runs on push to main, agent/builder,
# agent/integration, agent/guardian, plus PRs into main, plus
# manual workflow_dispatch triggers.
#
# Validates TypeScript, Rust core, and the full Windows Tauri
# production build. Windows artifacts (NSIS + MSI) are uploaded
# with SHA-256 sums for the three-agent QA pipeline.
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches:
      - main
      - agent/builder
      - agent/integration
      - agent/guardian
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend validation ──────────────────────────────────────
  frontend:
    name: Frontend (typecheck · lint · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Frontend tests
        run: pnpm run test

      - name: Frontend production build
        run: pnpm run build

  # ── Rust core validation (no tauri-runtime, any platform) ────
  rust-core:
    name: Rust core (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Rustfmt check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Clippy (core, no tauri-runtime)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests (core)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace

  # ── Windows Tauri build (the real desktop target) ────────────
  # Per the three-agent model: Zai Linux sandbox handles frontend
  # + Rust core; this Windows job handles the actual Tauri runtime
  # compile + installer production. A green Windows job here is
  # a release gate — no Paperu candidate is "green" without it.
  windows-build:
    name: Windows Tauri build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm run build

      - name: Rust fmt check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Clippy (with tauri-runtime)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features tauri-runtime -- -D warnings

      - name: Rust tests (with tauri-runtime)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --features tauri-runtime

      - name: Tauri production build
        run: pnpm --filter @paperu/desktop tauri build --features tauri-runtime
        env:
          # No Authenticode code-signing certificate in CI. The build
          # produces an UNSIGNED validation installer. Label the
          # artifact as "Windows Release Candidate — unsigned" in
          # release notes; do NOT claim production signing.
          TAURI_SIGNING_PRIVATE_KEY: ""

      # ── Generate SHA-256 for all distributable installers ─────
      - name: Generate SHA-256 sums
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle"
          $sums = @()
          Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $rel = $_.FullName.Substring((Get-Location).Path.Length).TrimStart('\','/')
            $sums += "$hash  $rel"
            Write-Host "Hashed: $rel -> $hash"
          }
          if ($sums.Count -eq 0) {
            Write-Host "::error::No installer artifacts found in $bundleDir"
            exit 1
          }
          $sums | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Write-Host "SHA256SUMS.txt contents:"
          Get-Content SHA256SUMS.txt

      - name: Verify installers exist (no silent success)
        shell: pwsh
        run: |
          $bundleDir = "apps/desktop/src-tauri/target/release/bundle"
          $installers = Get-ChildItem -Path $bundleDir -Recurse -Include *.exe,*.msi -ErrorAction SilentlyContinue
          if ($installers.Count -eq 0) {
            Write-Host "::error::No NSIS .exe or MSI .msi produced — Windows build cannot be a release candidate."
            exit 1
          }
          Write-Host "Found $($installers.Count) installer(s):"
          $installers | ForEach-Object {
            $size = [math]::Round($_.Length / 1MB, 2)
            Write-Host "  $($_.Name)  ($size MB)"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperu-windows-x64-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
            apps/desktop/src-tauri/target/release/paperu.exe
          if-no-files-found: error
          retention-days: 30
