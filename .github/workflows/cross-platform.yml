name: Cross-platform native build

on:
  push:
    branches: [agent/builder]
  pull_request:
    branches: [agent/builder]

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: windows-x64
            bundles: nsis,msi
            rust-target: x86_64-pc-windows-msvc
          - os: macos-15
            label: macos-arm64
            bundles: app,dmg
            rust-target: aarch64-apple-darwin
          - os: macos-13
            label: macos-x64
            bundles: app,dmg
            rust-target: x86_64-apple-darwin
          - os: ubuntu-22.04
            label: linux-x64
            bundles: deb,appimage
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    name: Native build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
          components: rustfmt, clippy

      - name: Install Linux native dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            xdg-utils

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm run typecheck

      - name: Frontend lint
        run: pnpm run lint

      - name: Frontend test
        run: pnpm run test

      - name: Frontend build
        run: pnpm run build

      - name: Rust fmt check
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check

      - name: Clippy (with tauri-runtime)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features tauri-runtime -- -D warnings

      - name: Rust tests (with tauri-runtime)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --workspace --features tauri-runtime

      - name: Build Tauri native bundles
        shell: bash
        run: pnpm --filter @paperu/desktop tauri build --features tauri-runtime --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Assert artifacts exist
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="apps/desktop/src-tauri/target/release/bundle"
          echo "Bundle dir: $BUNDLE_DIR"
          find "$BUNDLE_DIR" -type f 2>/dev/null || true
          case "${{ matrix.label }}" in
            windows-x64)
              test -f "$BUNDLE_DIR/nsis"/*.exe -o -f "$BUNDLE_DIR/msi"/*.msi || { echo "::error::No NSIS/MSI artifacts"; exit 1; }
              ;;
            macos-*)
              test -d "$BUNDLE_DIR/dmg" || { echo "::error::No DMG bundle"; exit 1; }
              ;;
            linux-x64)
              test -f "$BUNDLE_DIR/deb"/*.deb -o -f "$BUNDLE_DIR/appimage"/*.AppImage || { echo "::error::No DEB/AppImage artifacts"; exit 1; }
              ;;
          esac

      - name: Generate SHA-256 sums
        shell: bash
        run: |
          find apps/desktop/src-tauri/target/release/bundle -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) -exec sha256sum {} \; > sha256sums.txt || true
          cat sha256sums.txt || echo "No artifacts to hash"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paperu-${{ matrix.label }}-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            sha256sums.txt
          if-no-files-found: warn
