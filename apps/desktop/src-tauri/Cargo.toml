[package]
name = "paperu"
version = "0.1.0"
description = "Paperu — a Windows-first, local-first file workspace."
authors = ["Paperu"]
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/hello-aditya-dev/paperu"
readme = "README.md"
keywords = ["paperu", "desktop", "file-workspace", "local-first", "tauri"]
categories = ["filesystem", "development-tools"]
default-run = "paperu"
edition = "2021"
rust-version = "1.75"

# ── Library (used by Tauri build + integration tests) ─────────────
[lib]
name = "paperu"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
# Serialization (contract-first IPC)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling (unified error model)
thiserror = "2.0"

# Async runtime for the task engine
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "fs",
  "io-util",
  "time",
] }
tokio-util = "0.7"

# Tracing/structured logging (local only, rotated)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Local SQLite state
rusqlite = { version = "0.40", features = ["bundled"] }

# Utilities
uuid = { version = "1.27", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Tauri runtime (optional — enables the desktop shell + IPC commands)
tauri = { version = "2.12", features = [], optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }

[features]
default = []
# Enables the Tauri desktop shell. Off by default so the core logic
# (filesystem, database, settings, tasks, errors) can be checked and
# tested on any platform without GTK/WebView system libraries.
tauri-runtime = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-build",
]
# Required by Tauri to ship a production build.
custom-protocol = ["tauri/custom-protocol"]

# ── Optimise release builds for a commercial desktop app ──────────
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
debug = true
