[package]
name = "paperu"
version = "0.1.0"
description = "Paperu — a Windows-first, local-first file workspace."
authors = ["Paperu"]
license = "SEE LICENSE IN LICENSE"
repository = "https://github.com/hello-aditya-dev/paperu"
readme = "README.md"
keywords = ["paperu", "desktop", "file-workspace", "local-first", "tauri"]
categories = ["filesystem", "development-tools"]
default-run = "paperu"
edition = "2021"
rust-version = "1.88"

# ── Library (used by Tauri build + integration tests) ─────────────
[lib]
name = "paperu"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
# Serialization (contract-first IPC)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling (unified error model)
thiserror = "2.0"

# Async runtime for the task engine
tokio = { version = "1.53", features = [
  "rt-multi-thread",
  "sync",
  "macros",
  "fs",
  "io-util",
  "time",
] }
tokio-util = "0.7"

# Tracing/structured logging (local only, rotated)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

# Local SQLite state
rusqlite = { version = "0.40", features = ["bundled"] }

# Utilities
uuid = { version = "1.27", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Archive Studio — safe ZIP create/extract (Feature 15, Wave D §32).
# Pure Rust, MIT/Apache-2.0, well-maintained, no existing dep solves
# ZIP. Extraction reuses our validate_zip_entry + is_contained +
# is_suspicious_ratio guards for ZIP-Slip + decompression-bomb safety.
zip = { version = "2", default-features = false, features = ["deflate", "time"] }

# PDF page operations (rotate/delete/extract) — OSS harvest (lopdf, MIT).
# Unlocks 3 ABSENT features. Pure Rust; loads PDFs, manipulates the page
# tree, saves via save_to(writer). No C++ bundling needed.
lopdf = { version = "0.45", default-features = false }

# Watch Folders — filesystem watching (OSS harvest, notify CC0).
# The standard Rust fs-watcher; uses ReadDirectoryChangesW on Windows,
# FSEvents on macOS, inotify on Linux. Paperu implements its own 400ms
# path-dedupe debounce (the "mini" debouncer crate collapses event
# kinds to Any/AnyContinuous, losing create/modify/remove distinction).
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# Shared copy+verify primitive (90% §52) — SHA-256 source/dest compare.
sha2 = "0.11"

# Native image processing (Prompt 01 §5.1) — MIT/Apache-2.0, commercially
# redistributable. Used by the Recipe engine for Resize / Convert /
# StripExif / image Watermark. JPEG + PNG enabled (WebP needs a C
# dependency on some builds; keep off for portability).
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "bmp",
  "ico",
] }

# Font rasterization for native text watermarking (Prompt 01 §9).
# ab_glyph is pure Rust (MIT/Apache-2.0) + renders TTF outlines into
# alpha bitmaps we composite onto image buffers + PDF content streams.
# We bundle DejaVu Sans Bold (Bitstream license) — see assets/fonts/.
ab_glyph = "0.2"

# IANA timezone database for Timer Jobs (Prompt 02 §10.1).
# chrono-tz is pure Rust (MIT/Apache-2.0) + provides the full IANA
# timezone database (Asia/Kolkata, America/New_York, etc.) with
# correct DST handling.
chrono-tz = "0.10"

# Tauri runtime (optional — enables the desktop shell + IPC commands)
tauri = { version = "2.12", features = [], optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }

[features]
default = []
# Enables the Tauri desktop shell. Off by default so the core logic
# (filesystem, database, settings, tasks, errors) can be checked and
# tested on any platform without GTK/WebView system libraries.
tauri-runtime = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-window-state",
  "dep:tauri-build",
]
# Required by Tauri to ship a production build.
custom-protocol = ["tauri/custom-protocol"]

# ── Optimise release builds for a commercial desktop app ──────────
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
debug = true
