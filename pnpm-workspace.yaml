# Paperu — pnpm workspace definition
# A monorepo: one desktop app plus shared packages.

packages:
  - "apps/*"
  - "packages/*"

# pnpm 12.x: explicitly allow only canvas to run its build script.
# canvas@3.2.3 needs prebuild-install/node-gyp for native bindings
# (used by pdfjs test harness). No other dependencies require build
# scripts. This replaces the previous dangerouslyAllowAllBuilds
# which was overly permissive.
onlyBuiltDependencies:
  - canvas
